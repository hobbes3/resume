repos:
  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.7.4
    hooks:
      - id: betterleaks-system
  - repo: https://github.com/semgrep/semgrep
    rev: v1.172.0
    hooks:
      - id: semgrep
        args: ["--config=auto", "--error"]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint --fix
        language: system
        types_or: [javascript, jsx, ts, tsx]
      - id: stylelint
        name: stylelint
        entry: npx stylelint --fix
        language: system
        types_or: [css, sass]
      - id: html-validate
        name: html-validate
        entry: npx html-validate
        language: system
        types: [html]
