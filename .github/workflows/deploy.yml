name: Update Symlink & Deploy Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-symlink:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies (Poppler for PDF conversion)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Create or update symlink and generate PNG
        run: |
          LATEST_FILE=$(ls hobbes3_resume_v*.pdf 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$LATEST_FILE" ]; then
            echo "No matching resume file found!"
            exit 1
          fi

          echo "Latest resume file identified: $LATEST_FILE"

          ln -sf "$LATEST_FILE" hobbes3_resume_latest.pdf

          # -png: Output format PNG
          # -f 1 -l 1: First page only (page 1)
          # -r 150: DPI resolution (150-300 dpi gives crisp text)
          pdftoppm -png -f 1 -l 1 -r 150 "$LATEST_FILE" images/hobbes3_resume_latest

          # pdftoppm appends '-1.png' to single-page exports, so we rename it
          if [ -f images/hobbes3_resume_latest-1.png ]; then
            mv images/hobbes3_resume_latest-1.png images/hobbes3_resume_latest.png
          fi

      - name: Commit and push updated symlink and image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage both the symlink and the new PNG image
          git add hobbes3_resume_latest.pdf images/hobbes3_resume_latest.png

          if git diff --staged --quiet; then
            echo "Symlink and PNG are already up to date."
          else
            git commit -m "chore: auto-update resume symlink and PNG preview [skip ci]"
            git push
          fi

  deploy:
    needs: update-symlink
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
