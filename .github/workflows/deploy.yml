name: Update Assets & Deploy Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Step 0 - Install dependencies (Poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Step 1 - Create or update PDF symlink
        run: |
          LATEST_FILE=$(ls resumes/hobbes3_resume_v*.pdf 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$LATEST_FILE" ]; then
            echo "No matching resume file found!"
            exit 1
          fi

          echo "Latest resume file identified: $LATEST_FILE"

          TARGET_FILENAME=$(basename "$LATEST_FILE")
          ln -sf "$TARGET_FILENAME" "resumes/hobbes3_resume_latest.pdf"

      - name: Step 2 - Convert PDF to PNG preview
        run: |
          LATEST_FILE=$(ls resumes/hobbes3_resume_v*.pdf 2>/dev/null | sort -V | tail -n 1)

          mkdir -p images

          # Convert page 1 of the latest PDF to PNG at 300 DPI
          pdftoppm -png -f 1 -l 1 -r 300 "$LATEST_FILE" resumes/hobbes3_resume_latest

          # Rename default output (hobbes3_resume_latest-1.png) to standard target
          if [ -f resumes/hobbes3_resume_latest-1.png ]; then
            mv resumes/hobbes3_resume_latest-1.png resumes/hobbes3_resume_latest.png
          fi

      - name: Step 3 - Commit and push updated assets
        if: ${{ !env.ACT && github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add resumes/hobbes3_resume_latest.pdf resumes/hobbes3_resume_latest.png

          if git diff --staged --quiet; then
            echo "Assets are already up to date."
          else
            git commit -m "chore: auto-update resume symlink and PNG preview [skip ci]"
            git push
          fi

  deploy:
    needs: build-assets
    if: ${{ github.actor != 'nektos/act' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest changes from main
        run: git pull origin main

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
