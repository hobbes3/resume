name: OpenTofu Drift Detection

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    env:
      TF_VAR_account_id: ecb38e99c15d28c64e8794aeca162eac
      TF_VAR_zone_id: f3528c90e0b1c9516a279b76be10da07
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.6"

      - name: OpenTofu Init
        run: tofu init
        working-directory: opentofu

      - name: OpenTofu Plan (Drift Check)
        id: drift
        run: |
          # Capture output and exit code safely
          set +e
          tofu plan -detailed-exitcode -no-color > drift_plan.txt
          exit_code=$?
          set -e

          if [ "$exit_code" -eq 2 ]; then
            echo "Drift detected!"
            echo "DRIFT_DETECTED=true" >> "$GITHUB_ENV"
          elif [ "$exit_code" -ne 0 ]; then
            echo "::error::OpenTofu plan failed with error code $exit_code"
            exit "$exit_code"
          fi
        working-directory: opentofu

      - if: env.DRIFT_DETECTED == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🚨 OpenTofu Infrastructure Drift Detected"
          content-filepath: opentofu/drift_plan.txt
          labels: |
            drift
            infrastructure
            automated-issue
