name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  misspell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-misspell@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_level: warning
          locale: "US"
          pattern: "index.html"
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EPMatt/reviewdog-action-prettier@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_level: warning
  stylelint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-stylelint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          stylelint_inputs: "src/css/**/*.css"
          fail_level: warning
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          eslint_flags: "src/js/"
          fail_level: warning
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-markdownlint@v0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_level: warning
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail_level: warning
  betterleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: |
          gh release download --repo betterleaks/betterleaks --pattern "*linux_x64.tar.gz" --clobber
          tar -xzf ./*.tar.gz
          sudo mv betterleaks /usr/local/bin/
          rm ./*.tar.gz
          betterleaks git . -v
  html5validator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: |
          npm ci
          npx html-validate "src/**/*.html"
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: |
          npm ci
          npm audit --audit-level=high
  build:
    runs-on: ubuntu-latest
    needs:
      [
        misspell,
        prettier,
        stylelint,
        eslint,
        markdownlint,
        actionlint,
        betterleaks,
        html5validator,
        security-audit,
      ]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Step 1 - Copy all static src/ files to dist/
        run: |
          mkdir -p dist
          cp -r src/* dist/

      - name: Step 2 - Generate resume pdf
        run: node scripts/generate-resume-pdf.js

      - name: Step 3 - Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/reports/sbom.cyclonedx.json

      - name: Step 4 - Scan SBOM with Grypeu
        uses: anchore/scan-action@v7
        with:
          sbom: dist/reports/sbom.cyclonedx.json
          fail-build: true
          severity-cutoff: high

      - name: Step 5 - Upload dist/ directory as artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-build
          path: dist/
          retention-days: 1
  lychee:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-build
          path: dist
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          workingDirectory: dist
          args: --offline --verbose --no-progress './**/*.md' './**/*.html'
          fail: false
      - if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Lychee Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated issue
  lighthouse:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v8
        with:
          name: dist-build
          path: dist
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
      - if: always()
        run: |
          [ -d .lighthouseci ] && cp .lighthouseci/lhr-*.html dist/lhr-latest.html || true
          npm ci
          node scripts/generate-lighthouse-score-img.js
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dist-build
          path: dist
          retention-days: 1
          overwrite: true
  deploy:
    needs: [lychee, lighthouse]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-build
          path: dist
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=site-resume
