name: CI/CD

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  misspell:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-misspell@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          fail_level: warning
          locale: "US"
  prettier:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - if: github.event_name == 'pull_request'
        uses: EPMatt/reviewdog-action-prettier@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: warning
      - if: github.event_name != 'pull_request'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: github.event_name != 'pull_request'
        run: |
          npm ci
          npx prettier --check .
  stylelint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-stylelint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          stylelint_inputs: "css/**/*.css"
          fail_level: warning
  eslint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-eslint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          eslint_flags: "js/"
          fail_level: warning
  markdownlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-markdownlint@v0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          fail_level: warning
  actionlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          fail_level: warning
  betterleaks:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26
          cache: false # Otherwise it looks for go.mod.
      - run: go install github.com/betterleaks/betterleaks@latest
      - run: betterleaks git . -v
  html5validator:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx html-validate "**/*.html"
  link-checker:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        id: lychee
        with:
          args: --offline '.'
  build-and-deploy:
    needs:
      [
        misspell,
        prettier,
        stylelint,
        eslint,
        markdownlint,
        actionlint,
        betterleaks,
        html5validator,
        link-checker,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - name: Step 0 - Install dependencies (Poppler)
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Step 1 - Create resume PDF symlink
        run: |
          files=(resumes/hobbes3_resume_v*.pdf)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No matching resume file found!"
            exit 1
          fi

          LATEST_FILE=$(printf '%s\n' "${files[@]}" | sort -V | tail -n1)
          echo "Latest resume file identified: $LATEST_FILE"

          TARGET_FILENAME=$(basename "$LATEST_FILE")
          ln -sf "$TARGET_FILENAME" "resumes/hobbes3_resume_latest.pdf"

      - name: Step 2 - Convert resume PDF to PNG preview
        run: |
          pdftoppm -png -r 150 -f 1 -l 1 "resumes/hobbes3_resume_latest.pdf" "resumes/hobbes3_resume_latest_preview"

          if [ -f "resumes/hobbes3_resume_latest_preview-1.png" ]; then
            mv "resumes/hobbes3_resume_latest_preview-1.png" "resumes/hobbes3_resume_latest_preview.png"
            echo "Successfully generated resumes/hobbes3_resume_latest_preview.png"
          fi

      - name: Step 3 - Create dist folder and organize assets
        run: |
          mkdir -p dist
          cp -r index.html favicon.png css js images resumes slides dist/ 2>/dev/null || true

      - name: Step 4 - Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=site-resume
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
