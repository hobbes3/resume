name: Build & Deploy Page

on:
  workflow_run:
    workflows: ["checks.yaml"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - name: Step 0 - Install dependencies (Poppler)
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Step 1 - Create resume PDF symlink
        run: |
          LATEST_FILE=$(ls resumes/hobbes3_resume_v*.pdf 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$LATEST_FILE" ]; then
            echo "No matching resume file found!"
            exit 1
          fi

          echo "Latest resume file identified: $LATEST_FILE"

          TARGET_FILENAME=$(basename "$LATEST_FILE")
          ln -sf "$TARGET_FILENAME" "resumes/hobbes3_resume_latest.pdf"

      - name: Step 2 - Convert resume PDF to PNG preview
        run: |
          LATEST_FILE=$(ls resumes/hobbes3_resume_v*.pdf 2>/dev/null | sort -V | tail -n 1)

          pdftoppm -png -f 1 -l 1 -r 300 "$LATEST_FILE" resumes/hobbes3_resume_latest

          if [ -f resumes/hobbes3_resume_latest-1.png ]; then
            mv resumes/hobbes3_resume_latest-1.png resumes/hobbes3_resume_latest.png
          fi

      - name: Step 3 - Create dist folder and organize assets
        run: |
          mkdir -p dist
          cp -r index.html favicon.png css js images resumes slides dist/ 2>/dev/null || true

      - name: Step 4 - Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=site-resume
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
