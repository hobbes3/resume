name: Build & Deploy Page

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Step 0 - Install dependencies (Poppler)
        run: |
          sudo apt-get update -y -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Step 1 - Create resume PDF symlink
        run: |
          LATEST_FILE=$(ls resumes/hobbes3_resume_v*.pdf 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$LATEST_FILE" ]; then
            echo "No matching resume file found!"
            exit 1
          fi

          echo "Latest resume file identified: $LATEST_FILE"

          TARGET_FILENAME=$(basename "$LATEST_FILE")
          ln -sf "$TARGET_FILENAME" "resumes/hobbes3_resume_latest.pdf"

      - name: Step 2 - Convert resume PDF to PNG preview
        run: |
          LATEST_FILE=$(ls resumes/hobbes3_resume_v*.pdf 2>/dev/null | sort -V | tail -n 1)

          # Convert page 1 of the latest PDF to PNG at 300 DPI
          pdftoppm -png -f 1 -l 1 -r 300 "$LATEST_FILE" resumes/hobbes3_resume_latest

          # Rename default output (hobbes3_resume_latest-1.png) to standard target
          if [ -f resumes/hobbes3_resume_latest-1.png ]; then
            mv resumes/hobbes3_resume_latest-1.png resumes/hobbes3_resume_latest.png
          fi

      - name: Step 3 - Upload assets for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
