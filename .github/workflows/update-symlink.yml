name: Update Resume Symlink

on:
  push:
    branches:
      - main # Change to master if your default branch is named master

jobs:
  update-symlink:
    runs-on: ubuntu-latest

    # Grants write permissions to commit changes back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update symlink
        run: |
          LATEST_FILE=$(ls hobbes3_resume_v*.pdf 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$LATEST_FILE" ]; then
            echo "No matching resume file found!"
            exit 1
          fi

          echo "Latest resume file identified: $LATEST_FILE"

          ln -sf "$LATEST_FILE" hobbes3_resume_latest.pdf

      - name: Commit and push updated symlink
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add hobbes3_resume_latest.pdf

          if git diff --staged --quiet; then
            echo "Symlink is already up to date. Nothing to commit."
          else
            git commit -m "chore: auto-update resume symlink to latest version"
            git push
          fi
