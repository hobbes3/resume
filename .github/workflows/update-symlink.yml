name: Update Symlink & Deploy Pages

on:
  push:
    branches:
      - main # Change to master if your default branch is master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update-symlink:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update symlink
        run: |
          LATEST_FILE=$(ls hobbes3_resume_v*.pdf 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$LATEST_FILE" ]; then
            echo "No matching resume file found!"
            exit 1
          fi

          echo "Latest resume file identified: $LATEST_FILE"
          ln -sf "$LATEST_FILE" hobbes3_resume_latest.pdf

      - name: Commit and push updated symlink
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add hobbes3_resume_latest.pdf

          # Only commit if the symlink actually changed
          # Uses [skip ci] so the bot's commit doesn't trigger a duplicate workflow run
          if git diff --staged --quiet; then
            echo "Symlink is already up to date."
          else
            git commit -m "chore: auto-update resume symlink [skip ci]"
            git push
          fi

  deploy:
    needs: update-symlink
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "." # Deploys the root directory

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
