app:
  applicationId: 2a06d560-4aaf-4d57-a7a4-72b9ff3fd998
  env: Development
  host: ${APP_HOST:http://localhost:8000}
  tags:
    - name: _STACKHAWK_GIT_COMMIT_SHA
      value: ${ENV_VAR_FOR_COMMIT_SHA}
    - name: _STACKHAWK_GIT_BRANCH
      value: ${ENV_VAR_FOR_BRANCH}
  redact:
    headers:
      - CF-Access-Client-Id
      - CF-Access-Client-Secret
hawk:
  spider:
    minRoutesFound: 1
    basePath: /
    seedPaths:
      - /index.html
    customHeaders:
      - name: CF-Access-Client-Id
        value: ${CF_ACCESS_CLIENT_ID}
      - name: CF-Access-Client-Secret
        value: ${CF_ACCESS_CLIENT_SECRET}
    ignoreList:
      - 10054 # Ignores "Cookie Without SameSite Attribute"
